# `test/setup.ts` registers a DOM (happy-dom) before any test file is imported.
#
# A preload rather than a per-file import (salo-ba pattern): `bun test` runs
# every file in one process, and registering a second global document would
# detach trees React already mounted.
[test]
preload = ["./test/setup.ts"]
# The Playwright e2e suite (e2e/*.spec.ts) needs a browser and a dev server;
# it runs with `bun run e2e`, never in `bun test`.
pathIgnorePatterns = ["e2e/**"]
